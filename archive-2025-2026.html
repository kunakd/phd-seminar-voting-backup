<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhD Seminar Results Archive 2025/2026</title><style>body{font-family:Arial,sans-serif;max-width:780px;margin:30px auto;padding:20px;text-align:center;color:#333}header img{height:120px}.seminar{border:1px solid #ccc;border-radius:8px;padding:18px;margin-top:20px}p{margin:9px}.winner{color:green;font-weight:bold}.votes{color:darkorange;font-weight:bold}select{padding:9px;max-width:100%}</style></head><body><header><img src="logo.jpg" alt="Department logo"><h1>PhD Seminar Evaluation Results</h1><p>Archive – Academic Year 2025/2026</p></header><label for="seminar">Select seminar: </label><select id="seminar"><option value="">-- choose seminar --</option></select><main id="results" aria-live="polite"></main><nav><p><a href="results.html">Current results (2026/2027)</a></p></nav><script>
const select=document.getElementById('seminar'),main=document.getElementById('results');let archive=null;
function line(parent,text,cls){const p=document.createElement('p');p.textContent=text;if(cls)p.className=cls;parent.appendChild(p)}
function render(){main.replaceChildren();if(!archive||!select.value)return;const d=archive.seminars[select.value];if(!d)return;const box=document.createElement('div');box.className='seminar';const h=document.createElement('h2');h.textContent=select.value;box.appendChild(h);line(box,`${d.numberOfVotes} participants submitted their votes`,'votes');if(!d.numberOfVotes){line(box,'No votes recorded.');main.appendChild(box);return}const ranked=[...d.presentations].sort((a,b)=>b.averageScore-a.averageScore);ranked.forEach((p,i)=>line(box,`${i+1}. ${p.name}: ${p.averageScore.toFixed(2)} points`));const top=ranked[0].averageScore;const winners=ranked.filter(p=>Math.abs(p.averageScore-top)<1e-9).map(p=>p.name);line(box,`${winners.length===1?'Winner':'Winners'}: ${winners.join(', ')} with ${top.toFixed(2)} points`,'winner');main.appendChild(box)}
select.addEventListener('change',render);fetch('legacy-results-2025-2026.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Archive not generated');return r.json()}).then(data=>{archive=data;for(const id of Object.keys(data.seminars)){const o=document.createElement('option');o.value=id;o.textContent=id;select.appendChild(o)}}).catch(()=>line(main,'The historical archive has not been published yet.'));
</script></body></html>
